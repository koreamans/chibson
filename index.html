<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chibson</title>
<style>
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--text:#ececec;--muted:#9b9b9b;--line:#3a3a3a;--accent:#10a37f;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#fff;--side:#f7f7f8;--panel:#f0f0f1;--text:#1f1f1f;--muted:#6b6b6b;--line:#e2e2e4;--accent:#10a37f;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}
body{height:100dvh;padding-top:env(safe-area-inset-top)}
button,textarea{-webkit-appearance:none;appearance:none}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Segoe UI","Noto Sans KR",sans-serif;display:flex}
aside{width:240px;background:var(--side);padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
aside h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{filter:brightness(1.1)}
.model{font-size:12px;color:var(--muted);word-break:break-all;margin-top:auto}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:24px 16px}
.row{max-width:760px;margin:0 auto 20px;display:flex;gap:12px}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.row.user{justify-content:flex-end}
.row.user .bub{background:var(--panel);padding:8px 16px;border-radius:18px;max-width:80%}
.bub{white-space:pre-wrap;word-break:break-word}
.bar{max-width:760px;width:100%;margin:0 auto;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border-radius:24px;padding:8px 8px 8px 18px}
textarea{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;resize:none;max-height:160px;padding:6px 0;font-size:16px}
#send{border-radius:50%;width:34px;height:34px;padding:0;background:var(--text);color:var(--bg);border:0}
#send:disabled{opacity:.3;cursor:default}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:5}
.card{width:100%;max-width:440px;text-align:center}
.card h2{margin:12px 0 4px;font-size:26px}
.card p{color:var(--muted);margin:0 0 20px}
.pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:16px;padding:40px 16px;cursor:pointer;background:var(--side);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--panel)}
.prog{margin-top:20px;text-align:left;display:none}
.stage{opacity:.35;transition:opacity .2s}
.stage.on{opacity:1}
.prog .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.track{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;width:0;background:var(--accent);transition:width .15s}
.err{color:#e5484d;margin-top:12px;font-size:13px}
@media(max-width:700px){aside{display:none}}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="logo" style="margin:auto;width:48px;height:48px;font-size:24px;border-radius:14px">C</div>
    <h2>Chibson</h2>
    <p>GGUF 모델 파일을 올리면 Chibson이 깨어납니다.</p>
    <label class="drop" id="drop">
      <input id="file" type="file" class="pick">
      <b>.gguf 파일 선택</b><br><span style="color:var(--muted);font-size:13px">또는 여기로 끌어다 놓기</span>
    </label>
    <div class="prog" id="prog">
      <div id="l0" style="font-size:13px;color:var(--muted);margin-bottom:10px;word-break:break-all"></div>
      <div class="stage on" id="s1">
        <div class="lab"><span>1. 업로드</span><span id="p1">0%</span></div>
        <div class="track"><div class="fill" id="f1"></div></div>
      </div>
      <div class="stage" id="s2">
        <div class="lab"><span>2. 모델 로딩</span><span id="p2">0%</span></div>
        <div class="track"><div class="fill" id="f2"></div></div>
      </div>
    </div>
    <div class="err" id="err">⚠ 스크립트가 실행되지 않았어요. 파일을 다운로드해서 브라우저(Chrome/Edge)로 직접 열어 주세요.</div>
  </div>
</div>

<aside>
  <h1><span class="logo">C</span>Chibson</h1>
  <button id="new">+ 새 채팅</button>
  <div class="model" id="mname"></div>
</aside>
<main>
  <div id="msgs"></div>
  <div class="bar">
    <div class="box">
      <textarea id="inp" rows="1" placeholder="Chibson에게 메시지 보내기"></textarea>
      <button id="send" disabled>↑</button>
    </div>
    <div class="hint">모든 처리는 이 브라우저 안에서만 이루어집니다. 파일은 서버로 전송되지 않아요.</div>
  </div>
</main>

<script>
document.getElementById('err').textContent='';
window.addEventListener('error',e=>{document.getElementById('err').textContent='오류: '+e.message});
const NO_RT='⚠ 이 미리보기 환경에서는 모델 실행 엔진(WebAssembly)을 불러올 수 없어서 업로드와 화면까지만 동작해요. 파일을 다운로드해 브라우저에서 직접 열면 실제 답변이 나옵니다.';
let wllama=null;
async function loadLib(){
  for(const ver of ['2.3.0','2.2.1','2.1.4']){
    const V='https://cdn.jsdelivr.net/npm/@wllama/wllama@'+ver+'/esm/';
    try{
      const {Wllama}=await import(V+'index.js');
      return new Wllama({
        'single-thread/wllama.wasm':V+'single-thread/wllama.wasm',
        'multi-thread/wllama.wasm':V+'multi-thread/wllama.wasm'
      });
    }catch(e){console.warn('wllama',ver,e)}
  }
  throw new Error('wllama 런타임을 불러오지 못했어요. 인터넷 연결을 확인하고, 채팅 미리보기가 아닌 다운로드한 파일로 열어 주세요.');
}
const $=id=>document.getElementById(id);
const setP=(n,v)=>{const p=Math.min(100,Math.round(v));$('p'+n).textContent=p+'%';$('f'+n).style.width=p+'%'};
let history=[],busy=false;

async function start(file){
  $('err').textContent='';
  if(!/\.gguf$/i.test(file.name)){$('err').textContent='.gguf 파일만 올릴 수 있어요.';return}
  $('prog').style.display='block';
  $('l0').textContent=file.name+' ('+(file.size/1048576).toFixed(0)+' MB)';
  try{
    // 1) 업로드: 파일을 스트림으로 읽으며 진행률 표시
    const r=file.stream().getReader();let got=0;
    for(;;){const {done,value}=await r.read();if(done)break;got+=value.length;setP(1,got/file.size*100)}
    setP(1,100);
    $('s2').classList.add('on');
    // 2) 모델 로딩 (미리보기처럼 외부 런타임이 막힌 환경에서는 UI만 동작)
    try{
      if(!wllama)wllama=await loadLib();
      await wllama.loadModel([file],{n_ctx:2048,progressCallback:({loaded,total})=>setP(2,loaded/total*100)});
    }catch(e){console.warn(e);wllama=false}
    setP(2,100);
    $('mname').textContent=file.name;
    $('gate').style.display='none';
    $('send').disabled=false;
    say('assistant',wllama?'안녕하세요, Chibson입니다. 무엇을 도와드릴까요?':NO_RT);
    $('inp').focus();
  }catch(e){$('err').textContent='모델을 불러오지 못했어요: '+(e.message||e)}
}

function say(role,text){
  const row=document.createElement('div');row.className='row '+role;
  row.innerHTML=(role==='assistant'?'<div class="av">C</div>':'')+'<div class="bub"></div>';
  row.querySelector('.bub').textContent=text;
  $('msgs').appendChild(row);$('msgs').scrollTop=1e9;
  return row.querySelector('.bub');
}

async function send(){
  const t=$('inp').value.trim();if(!t||busy)return;
  if(!wllama){say('user',t);say('assistant',NO_RT);$('inp').value='';return}
  busy=true;$('send').disabled=true;$('inp').value='';
  say('user',t);history.push({role:'user',content:t});
  const out=say('assistant','…');let text='';
  try{
    const stream=await wllama.createChatCompletion(
      [{role:'system',content:'You are Chibson, a helpful assistant. Reply in the user\u2019s language.'},...history],
      {nPredict:512,sampling:{temp:0.7},stream:true,useCache:true});
    for await(const c of stream){text=c.currentText;out.textContent=text;$('msgs').scrollTop=1e9}
    history.push({role:'assistant',content:text});
  }catch(e){out.textContent='오류: '+(e.message||e)}
  busy=false;$('send').disabled=false;$('inp').focus();
}

$('file').addEventListener('click',e=>{e.target.value=''});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;$('err').textContent='';start(f)});
const d=$('drop');
d.ondragover=e=>{e.preventDefault();d.classList.add('over')};
d.ondragleave=()=>d.classList.remove('over');
d.ondrop=e=>{e.preventDefault();d.classList.remove('over');e.dataTransfer.files[0]&&start(e.dataTransfer.files[0])};
$('send').onclick=send;
$('inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$('inp').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('new').onclick=()=>{history=[];$('msgs').innerHTML='';say('assistant','새 대화를 시작했어요. 무엇을 도와드릴까요?')};
</script>
</body>
</html>
